[package]
name = "VarRange"
version = "0.1.0"
edition = "2021"

[lib]
name = "VarRange"
crate-type = ["lib"]

[dependencies]
itertools = "0.7.8"
serde = { version = "1.0", features = ["derive"] }
curv = { package = "curv-kzen", version = "0.10.0", default-features = false, features = ["num-bigint"] }
merlin = { version = "3.0.0", default-features = false }
sha2 = "0.9"
generic-array = "0.14"


[features]
default = []
